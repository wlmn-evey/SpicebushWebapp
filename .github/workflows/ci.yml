name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'app/package-lock.json'

    - name: Install dependencies
      run: cd app && npm ci --legacy-peer-deps

    - name: Lint (zero warnings)
      run: cd app && npm run lint -- --max-warnings=0

    - name: Format check
      run: cd app && npm run format:check

    - name: Typecheck
      run: cd app && npm run typecheck

    - name: Unit tests
      run: cd app && npm run test

    - name: Build
      # Astro SSR defers DB connections to request time — no DATABASE_URL needed at build
      run: cd app && npm run build
