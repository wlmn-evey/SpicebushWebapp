name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Node.js (app/.nvmrc)
      uses: actions/setup-node@v6
      with:
        node-version-file: 'app/.nvmrc'
        cache: 'npm'
        cache-dependency-path: 'app/package-lock.json'

    - name: Install dependencies
      # Plain `npm ci` on purpose: it must fail if the lockfile can't install
      # cleanly (see issue #140). Do not add --force.
      run: cd app && npm ci

    - name: Lint (zero warnings)
      run: cd app && npm run lint -- --max-warnings=0

    - name: Format check
      run: cd app && npm run format:check

    - name: Typecheck
      run: cd app && npm run typecheck

    - name: Unit tests
      run: cd app && npm run test

    - name: Build
      # Astro SSR defers DB connections to request time — no DATABASE_URL needed at build
      run: cd app && npm run build
