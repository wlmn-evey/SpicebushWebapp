name: Deploy

on:
  push:
    branches: [main]

# Never run two production deploys at once; queue instead of cancelling a deploy mid-upload.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Netlify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'app/package-lock.json'

    - name: Install dependencies
      # --force is a workaround for the lockfile's platform-specific optional packages;
      # removing it is tracked in issues #42 and #140.
      run: cd app && npm ci --force

    - name: Build
      # Astro SSR defers DB connections to request time — no DATABASE_URL needed at build
      run: cd app && npm run build

    - name: Deploy to Netlify
      run: npx netlify deploy --prod --dir=app/dist --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
