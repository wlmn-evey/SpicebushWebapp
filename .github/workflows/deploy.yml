name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize production deploys so two quick merges can't race and leave the
# older build live. Never cancel a deploy that is already uploading.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Netlify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js (app/.nvmrc)
      uses: actions/setup-node@v7
      with:
        node-version-file: 'app/.nvmrc'
        cache: 'npm'
        cache-dependency-path: 'app/package-lock.json'

    - name: Install dependencies
      # Plain `npm ci`: the lockfile must install cleanly (issue #140). No --force.
      run: cd app && npm ci

    - name: Build
      # Astro SSR defers DB connections to request time — no DATABASE_URL needed at build
      run: cd app && npm run build

    - name: Deploy to Netlify
      # netlify-cli is not an app dependency, so pin the package explicitly.
      # Bare `npx netlify` would resolve the unrelated `netlify` package.
      run: npx --yes netlify-cli@27 deploy --prod --dir=app/dist --auth=$NETLIFY_AUTH_TOKEN --site=$NETLIFY_SITE_ID
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
