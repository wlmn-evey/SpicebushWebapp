name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'app/package-lock.json'

    - name: Install dependencies
      # --force is a workaround for the lockfile's platform-specific optional packages;
      # removing it is tracked in issues #42 and #140.
      run: cd app && npm ci --force

    - name: Audit (production dependencies)
      # Only runtime deps block PRs; dev-tool advisories are tracked separately (#43).
      run: cd app && npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: typescript, javascript
        config-file: ./.github/codeql-config.yml

    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'app/package-lock.json'

    - name: Install dependencies
      # --force is a workaround for the lockfile's platform-specific optional packages;
      # removing it is tracked in issues #42 and #140.
      run: cd app && npm ci --force

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
