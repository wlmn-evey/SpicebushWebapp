# Root Netlify configuration for the Spicebush Montessori production site
# (spicebushmontessori.org). Production deploys run from the repo root with
# --dir=app/dist; see docs/runbooks/deploy.md.

[build]
  # Build command for Astro app in root directory
  command = "npm run build"
  
  # Build optimization settings
  [build.processing]
    skip_processing = false
  [build.processing.css]
    bundle = true
    minify = true
  [build.processing.js]
    bundle = true
    minify = true
  
  # Note: there is no `base` key. The CLI/GitHub Actions deploy passes --dir=app/dist,
  # which overrides this publish value (see docs/runbooks/deploy.md).
  publish = "dist"
  
  # Node version and other environment settings.
  # NODE_VERSION must match app/.nvmrc, which every GitHub Actions workflow
  # reads through setup-node's node-version-file. Change both together.
  [build.environment]
    NODE_VERSION = "22.23"
    NODE_OPTIONS = "--max_old_space_size=4096"

# Testing branch context - ensures proper environment setup
[context.testing]
  [context.testing.environment]
    NODE_ENV = "production"
    ENVIRONMENT = "testing"

# Branch deploy context (all other branches)
[context.branch-deploy]
  [context.branch-deploy.environment]
    NODE_ENV = "development"

# Deploy preview context
[context.deploy-preview]
  [context.deploy-preview.environment]
    NODE_ENV = "development"

# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Keep in sync with app/src/lib/security-headers.ts (applied to SSR responses).
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    
# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects configuration

# The default Netlify subdomain serves the same deploy as the production domain.
# 301 it to the canonical domain so search engines consolidate there (issue #127).
# Deploy previews / branch deploys are NOT redirected; Astro middleware serves
# them X-Robots-Tag: noindex instead.
[[redirects]]
  from = "https://spicebush-testing.netlify.app/*"
  to = "https://spicebushmontessori.org/:splat"
  status = 301
  force = true

# Functions configuration
[functions]
  directory = "netlify/functions"
